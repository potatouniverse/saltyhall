meta:
  version: '2.0'
  domain: auto-generated
  schema:
    relations:
      code:
        - implements
        - depends_on
        - calls
        - reads
        - writes
        - tested_by
        - defined_in
      semantic:
        - enables
        - blocks
        - requires
        - precedes
        - refines
        - validates
        - related_to
        - decided_by
    discovered: []
    fields:
      owner:
        type: string
        description: 'Who owns this task: "human" (potato) or "clawd" (bot)'
        values: [human, clawd]
